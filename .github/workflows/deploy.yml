name: Publish Docs via GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kildekode
        uses: actions/checkout@v4

      - name: Opsæt uv (Pakkehåndtering)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer Python
        run: uv python install

      - name: Byg MkDocs hjemmesiden lokalt på serveren
        run: |
          uv run mkdocs build

      - name: Pak og upload de færdige HTML-filer (Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          # MkDocs spytter altid de færdige filer ud i mappen 'site'
          path: ./site

      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
